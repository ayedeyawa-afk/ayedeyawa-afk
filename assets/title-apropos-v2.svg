<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#d4607f"/><stop offset="1" stop-color="#2f7f7c"/></linearGradient>
<style>
@keyframes s{0%{transform:translateX(-1000px);opacity:0}8%{transform:translateX(0);opacity:1}92%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.s{animation:s 12s ease-out infinite}
text{font-family:'Segoe UI',Arial,sans-serif;fill:#fff}
.nm{paint-order:stroke;stroke:#0b3d3b;stroke-opacity:.3;stroke-width:4px}
</style>
</defs>
<g class="s"><rect y="5" width="1000" height="60" rx="30" fill="url(#g)"/><circle cx="960" cy="35" r="7" fill="#e6c27a"/><text class="nm" x="40" y="46" font-size="30" font-weight="700">À propos de moi</text></g>
</svg>
